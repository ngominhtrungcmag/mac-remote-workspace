name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: xcode-27  # Xcode 26.6 (Swift 6.3) crashes type-checking AppCore
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        id: freerdp
        with:
          path: vendor
          key: freerdp-${{ runner.os }}-${{ hashFiles('scripts/build-freerdp-macos.sh') }}
      - if: steps.freerdp.outputs.cache-hit != 'true'
        run: ./scripts/build-freerdp-macos.sh
      # FreeRDP 3.10.2 GetComputerNameA rejects hostnames of 31+ chars (runner names are longer).
      - run: sudo scutil --set HostName mrw-ci && hostname
      - run: swift test
      - run: ./bundle-app.sh
      # ponytail: ad-hoc signed only; Developer ID signing + notarization run locally via scripts/release-macos.sh.
      - name: Package
        run: |
          v=${GITHUB_REF_NAME#v}
          zip="Mac-Remote-Workspace-$v-universal.zip"
          ditto -c -k --keepParent ".build/NativeApp/Mac Remote Workspace.app" "$zip"
          shasum -a 256 "$zip" > SHA256SUMS.txt
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --title "Mac Remote Workspace ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
          gh release upload "$GITHUB_REF_NAME" Mac-Remote-Workspace-*.zip SHA256SUMS.txt --clobber
